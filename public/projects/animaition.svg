<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Apple squircle background container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#appleGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" filter="url(#subtleShadow)"/>

  <!-- Iconic ✦ Four-Point Star Spark in Onyx Black -->
  <path d="M32 12 
           C32 23 23 32 12 32 
           C23 32 32 41 32 52 
           C32 41 41 32 52 32 
           C41 32 32 23 32 12 Z" 
        fill="#070709"/>
</svg>
